name: Terraform CI

on:
  pull_request:
    branches: [main]
    paths:
      - "bootstrap/**"
      - "modules/**"
      - "environments/prod/**"
      - ".github/workflows/terraform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Bootstrap plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bootstrap

    env:
      AWS_REGION: eu-north-1
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_aws_region: eu-north-1
      TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_github_owner_id: ${{ github.repository_owner_id }}
      TF_VAR_github_repository: ${{ github.event.repository.name }}
      TF_VAR_github_repository_id: ${{ github.repository_id }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - run: terraform fmt -check -recursive

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init -input=false
      - run: terraform validate -no-color
      - run: terraform plan -input=false -no-color -lock-timeout=5m

  prod:
    name: Production plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/prod

    env:
      AWS_REGION: eu-north-1
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - run: terraform fmt -check -recursive

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init -input=false
      - run: terraform validate -no-color
      - run: terraform plan -var-file=terraform.tfvars.example -input=false -no-color -lock-timeout=5m